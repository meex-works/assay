name = "assay-web"
main = "src/worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = false
# secret: API_KEY (= Keychain assay-api-key / assay), set with `wrangler secret put API_KEY`
routes = [{ pattern = "assay.meex.work", custom_domain = true }]   # your domain (a zone in your Cloudflare account)

[vars]
SITE_ORIGIN = "https://assay.meex.work"        # the site's own address
API_ORIGIN = "https://assay-api.meex.work"     # the tunnel hostname in front of src/api.ts

[assets]
directory = "public"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true   # every response goes through the Worker, so every page gets the hygiene headers
